name: API Lint

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  pull_request:
    branches:
      - '**'
    paths:
      - 'api/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  black:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      # Install dependencies
      - name: Install dependencies
        run: |
          cd api
          uv sync --all-extras

      # Run Black formatter
      - name: Run Black
        run: |
          cd api
          uv run black --check --diff .

  mypy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      # Install dependencies
      - name: Install dependencies
        run: |
          cd api
          uv sync --all-extras

      # Run MyPy checks
      - name: Run MyPy
        run: |
          cd api
          uv run mypy --install-types --non-interactive .

  ruff:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      # Install dependencies
      - name: Install dependencies
        run: |
          cd api
          uv sync --all-extras

      # Run Ruff linter and formatter
      - name: Run Ruff
        run: |
          cd api
          uv run ruff check .